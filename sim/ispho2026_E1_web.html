<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISPhO 2026 E1 — FBG Writer · HaslaLab</title>
<style>
  :root{--face:#f0f0f0;--line:#a0a0a0;--field:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e8ebee}
  body{font:13px/1.45 "Segoe UI",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#000}
  .bar{max-width:1180px;margin:0 auto;padding:14px 14px 0;display:flex;
       justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .bar h1{margin:0;font-size:16px;font-weight:650}
  .bar p{margin:2px 0 0;font-size:12px;color:#5b6b7c}
  .lang{display:flex;border:1px solid #c3ccd4;border-radius:6px;overflow:hidden;background:#fff}
  .lang button{border:0;padding:6px 13px;font:600 12px inherit;color:#5b6b7c;background:#fff;cursor:pointer}
  .lang button.on{background:#2c6f9b;color:#fff}
  .app{max-width:1180px;margin:12px auto;background:var(--face);border:1px solid #9aa3ab;
       border-radius:4px;overflow:hidden;box-shadow:0 6px 22px -14px rgba(0,0,0,.5)}
  .title{background:linear-gradient(#fdfdfd,#eceff1);border-bottom:1px solid #c9d0d6;
         padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:7px}
  .title i{width:11px;height:11px;border-radius:2px;background:#5b9bd5;display:block}
  .tabs{display:flex;gap:2px;padding:5px 6px 0;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);border-bottom:0;background:#e2e2e2;
    padding:4px 11px;font:12px inherit;cursor:pointer;border-radius:3px 3px 0 0}
  .tabs button.on{background:var(--face);font-weight:600;padding-bottom:5px}
  .body{display:flex;border-top:1px solid var(--line)}
  .settings{flex:0 0 208px;border:2px solid #3b5bdb;margin:8px;padding:8px}
  .settings .cap{font-size:11px;margin-bottom:6px}
  .fld{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}
  .fld label{flex:1}
  .fld input{width:74px;padding:2px 4px;border:1px solid #7a7a7a;background:var(--field);
             font:12px ui-monospace,Consolas,monospace}
  .settings button{margin-top:9px;width:100%;padding:4px;border:1px solid #7a7a7a;
    background:linear-gradient(#fafafa,#e4e4e4);font:12px inherit;cursor:pointer;border-radius:2px}
  .plotwrap{flex:1 1 auto;min-width:0;margin:8px 8px 0 0}
  canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);cursor:crosshair}
  .toolbar{display:flex;align-items:center;gap:3px;padding:4px 6px;font-size:12px}
  .toolbar button{border:1px solid transparent;background:none;padding:3px 7px;cursor:pointer;
    border-radius:3px;font:13px inherit}
  .toolbar button:hover{background:#e2e2e2}
  .toolbar button.on{background:#cfe0ef;border-color:#8ab}
  .coord{margin-left:auto;font:12px ui-monospace,Consolas,monospace;color:#333}
  .limits{border:2px solid #d64545;margin:2px 8px 8px;padding:7px 9px;display:flex;
    align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
  .limits input{width:70px;padding:2px 4px;border:1px solid #7a7a7a;font:12px ui-monospace,monospace}
  .limits button{padding:3px 9px;border:1px solid #7a7a7a;
    background:linear-gradient(#fafafa,#e4e4e4);font:12px inherit;cursor:pointer;border-radius:2px}
  .note{max-width:1180px;margin:0 auto 26px;padding:0 14px;font-size:11.5px;color:#7a8794;line-height:1.6}
  @media(max-width:820px){.body{flex-direction:column}.settings{flex:1 1 auto}.plotwrap{margin:0 8px}}
</style>
</head>
<body>
<div class="bar">
  <div><h1 id="t-h1"></h1><p id="t-h2"></p></div>
  <div class="lang"><button id="lang-ko" class="on">한국어</button><button id="lang-en">English</button></div>
</div>
<div class="app">
  <div class="title"><i></i><span>FBG Writer</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="body">
    <div class="settings">
      <div class="cap" id="t-params"></div>
      <div id="fields"></div>
      <button id="calc"></button>
    </div>
    <div class="plotwrap">
      <canvas id="plot"></canvas>
      <div class="toolbar">
        <button id="home" title="home">&#8962;</button>
        <button id="zoom" title="zoom">&#128269;</button>
        <button id="save" title="save">&#128190;</button>
        <span class="coord" id="coord">&mdash;</span>
      </div>
    </div>
  </div>
  <div class="limits">
    <span id="t-lim"></span>
    <span>Min &lambda; (nm):</span><input id="lmin" value="1540.0">
    <span>Max &lambda; (nm):</span><input id="lmax" value="1560.0">
    <button id="apply"></button>
  </div>
</div>
<p class="note" id="t-note"></p>
<script>
"use strict";
const T={
 ko:{h1:"ISPhO 2026 E1 — 광섬유 브래그 격자",
     h2:"주최측 FBG-Writer 를 그대로 옮긴 것",
     params:"Parameters", calc:"Calculate and plot",
     lim:"Plot Wavelength Limits (1540-1560 nm)", apply:"Apply limits to active tab",
     note:"스펙트로미터는 [1540, 1560] nm 를 봅니다. 돋보기 버튼을 켜고 그래프 위에 직사각형을 끌어 그리면 그 사각형이 새 축 범위가 됩니다(가로·세로 모두). 커서 좌표는 오른쪽 아래에 나옵니다. 집 버튼으로 원래 배율로 돌아갑니다. "},
 en:{h1:"ISPhO 2026 E1 — Fiber Bragg Grating",
     h2:"the organisers' FBG-Writer, moved into the browser",
     params:"Parameters", calc:"Calculate and plot",
     lim:"Plot Wavelength Limits (1540-1560 nm)", apply:"Apply limits to active tab",
     note:"The spectrometer covers [1540, 1560] nm. Switch on the magnifier and drag a rectangle on the plot; that rectangle becomes the new axes, in both directions. The cursor coordinates appear at the bottom right and the house button restores the full range. "}};
let lang=(new URLSearchParams(location.search).get("lang")==="en")?"en":"ko";

/* ══════════════════════════════════════════════════════════════
   아래는 FBG_Writer_win-x64.exe (PyInstaller, Python 3.9) 를 풀어
   app.py 의 바이트코드에서 그대로 복원한 상수와 식이다.

     Y_OPT = 0.45      FREQ = 1.0 kHz     n_c = 1.444
     A_temp_exp = 6.67e-6 /°C             T_solid = 110 °C
     HF_BASE = 20      HF_DELTA = 30      THETA_OPT = -27°
     kappa = 8.70e-8 * exp(-(dY-Y_OPT)^2 / 8)      [1/nm]
     kappa *= 1550/wl
     Lambda = v/FREQ * 1000                        [nm]
     delta  = 2*pi*n_c/wl - pi/Lambda
     gamma  = sqrt(kappa^2 - delta^2)              (복소수)
     t      = gamma / (gamma*cosh(gamma*L) - i*delta*sinh(gamma*L))
     t     *= 0.9 + 0.2*rand                       (진폭에 곱하는 잡음)
     T      = |t|^2 + 1e-6      →  가우시안 평활 sigma=4  →  10*log10
   ══════════════════════════════════════════════════════════════ */
const Y_OPT=0.45, FREQ=1.0, N_C=1.444, A_TEMP=6.67e-6, T_SOLID=110;
const HF_BASE=20, HF_DELTA=30, THETA_OPT=-27;
const KAPPA0=8.699999999999998e-8, KAPPA_PAR=8.699999999999998e-8,
      KAPPA_PER=6.089999999999998e-8, DN_F=1e-5;
const NPTS=50000, LAM_MIN=1540.0, LAM_MAX=1560.0;

/* 원본이 스스로 구현해 둔 gaussian_filter1d (sigma = 4) */
function gaussSmooth(y,sigma){
  const r=Math.ceil(4*sigma), k=new Float64Array(2*r+1); let sum=0;
  for(let i=-r;i<=r;i++){ const w=Math.exp(-0.5*(i/sigma)**2); k[i+r]=w; sum+=w; }
  for(let i=0;i<k.length;i++) k[i]/=sum;
  const n=y.length, out=new Float64Array(n);
  for(let i=0;i<n;i++){ let acc=0;
    for(let j=-r;j<=r;j++){ let m=i+j; if(m<0)m=0; if(m>=n)m=n-1; acc+=y[m]*k[j+r]; }
    out[i]=acc; }
  return out;
}

/* 복소수 산술 — 원본은 numpy 복소배열로 한 번에 처리한다 */
const cMul=(a,b)=>[a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const cSub=(a,b)=>[a[0]-b[0], a[1]-b[1]];
const cDiv=(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];
  return [(a[0]*b[0]+a[1]*b[1])/d, (a[1]*b[0]-a[0]*b[1])/d];};
function cSqrt(x){                      /* 실수 x 의 복소 제곱근 */
  return x>=0 ? [Math.sqrt(x),0] : [0,Math.sqrt(-x)];
}
function cCosh(z){ return [Math.cosh(z[0])*Math.cos(z[1]), Math.sinh(z[0])*Math.sin(z[1])]; }
function cSinh(z){ return [Math.sinh(z[0])*Math.cos(z[1]), Math.cosh(z[0])*Math.sin(z[1])]; }

/* 한 개 격자의 스펙트럼. gratings = [{Lambda, kappa, L_nm}] */
function spectrumDb(gs,wlMin,wlMax){
  const lam=new Float64Array(NPTS), Tv=new Float64Array(NPTS);
  for(let i=0;i<NPTS;i++){
    const wl=wlMin+(wlMax-wlMin)*i/(NPTS-1);
    lam[i]=wl;
    let acc=0;
    for(const q of gs){
      const kap=q.kappa*(1550/wl);
      const delta=2*Math.PI*N_C/wl - Math.PI/q.Lambda;
      const gam=cSqrt(kap*kap-delta*delta);
      const gL=[gam[0]*q.L_nm, gam[1]*q.L_nm];
      const den=cSub(cMul(gam,cCosh(gL)), cMul([0,delta],cSinh(gL)));
      const t=cDiv(gam,den);
      const noise=0.9+0.2*Math.random();
      const tn=[t[0]*noise,t[1]*noise];
      acc += (q.w!==undefined?q.w:1)*(tn[0]*tn[0]+tn[1]*tn[1]);
    }
    Tv[i]=acc+1e-6;
  }
  const sm=gaussSmooth(Tv,4);
  const db=new Float64Array(NPTS);
  for(let i=0;i<NPTS;i++) db[i]=10*Math.log10(sm[i]);
  return {lam,db};
}

const kappaOf=dY=>KAPPA0*Math.exp(-Math.pow(dY-Y_OPT,2)/8);
const lambdaOf=v=>v/FREQ*1000.0;                  /* nm */
/* Part D — 원본 run_cooling_simulation : 110 °C 에서 평탄부, HF_BASE/HF_DELTA */
function coolTemp(frame){
  const tau=frame;
  const hot=HF_BASE, dl=HF_DELTA;
  if(tau<hot)      return T_SOLID + (140-T_SOLID)*(1-tau/hot);
  if(tau<hot+dl)   return T_SOLID;
  return T_SOLID - (T_SOLID-25)*(1-Math.exp(-(tau-hot-dl)/18));
}
/* Part E.II — 원본 : F = 0.5 x^2 - 4.5 x + 24.5  (x 가 클 때)  /  2.5 x (작을 때) */
const forceOf=x => x<=2.5 ? 2.5*x : 0.5*x*x-4.5*x+24.5;

const TABS=[
 {id:"A",label:"Part A",fields:[["dY","dY (\u00b5m)"],["v","v (mm/s)"],["L","L (mm)"]]},
 {id:"C",label:"Part C",fields:[["t","t (\u00b0C)"]]},
 {id:"D",label:"Part D",fields:[["tau","\u03c4 (min)"]]},
 {id:"E1",label:"Part E.I",fields:[["F","F (N)"]]},
 {id:"E2",label:"Part E.II",fields:[["x","x (mm)"]]},
 {id:"F",label:"Part F",fields:[["th","\u03b8 (deg)"]]}];
const S={tab:"A",val:{dY:0,v:0.5,L:50,t:25,tau:0,F:0,x:0,th:0},
         curve:null,lmin:1540,lmax:1560,view:[1540,1560],ylim:null,zoom:false,drag:null};
const $=i=>document.getElementById(i);

function gratingNow(){
  const V=S.val, L50=50.0*1e6;
  switch(S.tab){
   case "A":  return [{Lambda:lambdaOf(V.v), kappa:kappaOf(V.dY), L_nm:V.L*1e6}];
   /* 아래 탭들은 원본이 v=0.536, L=50, dY=0.0 으로 고정한다 */
   case "C":  return [{Lambda:lambdaOf(0.536)*(1+(V.t-25)*A_TEMP),
                       kappa:kappaOf(0.0), L_nm:L50}];
   case "D":  return [{Lambda:lambdaOf(0.536)*(1+(coolTemp(Math.round(V.tau))-25)*A_TEMP),
                       kappa:kappaOf(0.0), L_nm:L50}];
   case "E1": return [{Lambda:lambdaOf(0.536)*(1+V.F*DN_F), kappa:kappaOf(0.0), L_nm:L50}];
   case "E2": return [{Lambda:lambdaOf(0.536)*(1+forceOf(V.x)*DN_F),
                       kappa:kappaOf(0.0), L_nm:L50}];
   case "F":  {const c=Math.cos((V.th-THETA_OPT)*Math.PI/180);
               return [{Lambda:lambdaOf(0.536), kappa:KAPPA_PAR, L_nm:L50, w:c*c},
                       {Lambda:lambdaOf(0.536)*(1+DN_F), kappa:KAPPA_PER, L_nm:L50, w:1-c*c}];}
  }
}
function compute(){
  const r=spectrumDb(gratingNow(),S.lmin,S.lmax);
  S.curve={lam:r.lam,db:r.db}; S.view=[S.lmin,S.lmax]; S.ylim=null;
}

let PX=null;
function draw(){
  const cv=$("plot"),dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth||760,h=Math.round(w*0.50);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle="#fff"; c.fillRect(0,0,w,h);
  const Lm=62,R=16,Tp=12,Bm=40,pw=w-Lm-R,ph=h-Tp-Bm;
  let yLo=-3,yHi=0.5;
  if(S.ylim){ yLo=S.ylim[0]; yHi=S.ylim[1]; }
  else if(S.curve){let mn=1e9,mx=-1e9;
    for(let i=0;i<S.curve.lam.length;i++){const l=S.curve.lam[i];
      if(l<S.view[0]||l>S.view[1])continue; const y=S.curve.db[i];
      if(y<mn)mn=y; if(y>mx)mx=y;}
    if(mn<1e8){const pad=Math.max((mx-mn)*0.08,0.25); yLo=mn-pad; yHi=mx+pad;}}
  const X=l=>Lm+pw*(l-S.view[0])/(S.view[1]-S.view[0]);
  const Y=v=>Tp+ph*(1-(v-yLo)/(yHi-yLo));
  PX={Lm,Tp,pw,ph,yLo,yHi};
  const span=S.view[1]-S.view[0];
  const stepX=[0.002,0.005,0.01,0.02,0.05,0.1,0.25,0.5,1,2.5,5,10].find(s=>span/s<=9)||10;
  const spanY=yHi-yLo;
  const stepY=[0.05,0.1,0.25,0.5,1,2,5,10,20].find(s=>spanY/s<=8)||20;
  c.font="10.5px 'DejaVu Sans',sans-serif";
  c.textAlign="center"; c.textBaseline="top";
  for(let k=Math.ceil(S.view[0]/stepX)*stepX;k<=S.view[1]+1e-9;k+=stepX){
    const x=X(k);
    c.strokeStyle="#b0b0b0"; c.lineWidth=0.6;
    c.beginPath(); c.moveTo(x,Tp); c.lineTo(x,Tp+ph); c.stroke();
    c.strokeStyle="#000"; c.beginPath(); c.moveTo(x,Tp+ph); c.lineTo(x,Tp+ph+4); c.stroke();
    c.fillStyle="#000"; c.fillText(k.toFixed(stepX<0.01?4:(stepX<0.1?3:(stepX<1?2:1))),x,Tp+ph+7);}
  c.textAlign="right"; c.textBaseline="middle";
  for(let k=Math.ceil(yLo/stepY)*stepY;k<=yHi+1e-9;k+=stepY){
    const y=Y(k);
    c.strokeStyle="#b0b0b0"; c.lineWidth=0.6;
    c.beginPath(); c.moveTo(Lm,y); c.lineTo(Lm+pw,y); c.stroke();
    c.strokeStyle="#000"; c.beginPath(); c.moveTo(Lm,y); c.lineTo(Lm-4,y); c.stroke();
    c.fillStyle="#000"; c.fillText(k.toFixed(stepY<0.5?2:1),Lm-7,y);}
  if(S.curve){
    c.save(); c.beginPath(); c.rect(Lm,Tp,pw,ph); c.clip();
    c.strokeStyle="#1f77b4"; c.lineWidth=1; c.beginPath();
    let started=false;
    for(let i=0;i<S.curve.lam.length;i++){const l=S.curve.lam[i];
      if(l<S.view[0]-1e-6||l>S.view[1]+1e-6)continue;
      const x=X(l),y=Y(S.curve.db[i]);
      started?c.lineTo(x,y):(c.moveTo(x,y),started=true);}
    c.stroke(); c.restore();}
  c.strokeStyle="#000"; c.lineWidth=1; c.strokeRect(Lm,Tp,pw,ph);
  c.fillStyle="#000"; c.textAlign="center"; c.textBaseline="top";
  c.fillText("\u03bb, nm",Lm+pw/2,h-15);
  c.save(); c.translate(14,Tp+ph/2); c.rotate(-Math.PI/2); c.fillText("T, dB",0,0); c.restore();
  if(S.drag){
    const x0=Math.min(S.drag.x0,S.drag.x1),x1=Math.max(S.drag.x0,S.drag.x1);
    const y0=Math.min(S.drag.y0,S.drag.y1),y1=Math.max(S.drag.y0,S.drag.y1);
    c.fillStyle="rgba(0,0,0,.08)"; c.fillRect(x0,y0,x1-x0,y1-y0);
    c.strokeStyle="#000"; c.lineWidth=1; c.setLineDash([4,3]);
    c.strokeRect(x0,y0,x1-x0,y1-y0); c.setLineDash([]);}}

function buildTabs(){const box=$("tabs"); box.innerHTML="";
  TABS.forEach(t=>{const b=document.createElement("button");
    b.textContent=t.label; if(t.id===S.tab)b.className="on";
    b.onclick=()=>{S.tab=t.id;S.curve=null;buildTabs();buildFields();draw();};
    box.appendChild(b);});}
function buildFields(){const t=TABS.find(x=>x.id===S.tab),box=$("fields"); box.innerHTML="";
  t.fields.forEach(([k,label])=>{
    const row=document.createElement("div"); row.className="fld";
    const l=document.createElement("label"); l.textContent=label;
    const inp=document.createElement("input"); inp.value=S.val[k];
    inp.oninput=()=>{const v=parseFloat(inp.value); if(!isNaN(v))S.val[k]=v;};
    row.appendChild(l); row.appendChild(inp); box.appendChild(row);});}
$("calc").onclick=()=>{compute();draw();};
$("apply").onclick=()=>{const a=parseFloat($("lmin").value),b=parseFloat($("lmax").value);
  if(isNaN(a)||isNaN(b)||b<=a)return;
  S.lmin=Math.max(1540,Math.min(a,1560)); S.lmax=Math.min(1560,Math.max(b,1540));
  $("lmin").value=S.lmin.toFixed(1); $("lmax").value=S.lmax.toFixed(1);
  compute(); draw();};
$("home").onclick=()=>{if(S.curve){S.view=[S.lmin,S.lmax]; S.ylim=null; draw();}};
$("zoom").onclick=()=>{S.zoom=!S.zoom;$("zoom").className=S.zoom?"on":"";};
$("save").onclick=()=>{if(!S.curve)return;
  let csv="lambda_nm,T_dB\n";
  for(let i=0;i<S.curve.lam.length;i++)csv+=S.curve.lam[i].toFixed(5)+","+S.curve.db[i].toFixed(4)+"\n";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="FBG_Part"+S.tab+".csv"; a.click();};
const plot=$("plot");
function toData(e){const r=plot.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  if(!PX)return null;
  return {px,py,l:S.view[0]+(px-PX.Lm)/PX.pw*(S.view[1]-S.view[0]),
          v:PX.yLo+(1-(py-PX.Tp)/PX.ph)*(PX.yHi-PX.yLo)};}
plot.addEventListener("pointermove",e=>{const d=toData(e); if(!d)return;
  $("coord").textContent="\u03bb="+d.l.toFixed(4)+"  T="+d.v.toFixed(3);
  if(S.drag){S.drag.x1=d.px; S.drag.y1=d.py; draw();}});
plot.addEventListener("pointerleave",()=>{$("coord").textContent="\u2014";});
plot.addEventListener("pointerdown",e=>{if(!S.zoom||!S.curve)return;
  const d=toData(e); S.drag={x0:d.px,y0:d.py,x1:d.px,y1:d.py};
  plot.setPointerCapture(e.pointerId);});
plot.addEventListener("pointerup",()=>{
  if(!S.drag)return;
  const x0=Math.min(S.drag.x0,S.drag.x1),x1=Math.max(S.drag.x0,S.drag.x1);
  const y0=Math.min(S.drag.y0,S.drag.y1),y1=Math.max(S.drag.y0,S.drag.y1);
  S.drag=null;
  /* matplotlib 처럼 : 그린 사각형이 새 축 범위가 된다 */
  const fx=p=>S.view[0]+(p-PX.Lm)/PX.pw*(S.view[1]-S.view[0]);
  const fy=p=>PX.yLo+(1-(p-PX.Tp)/PX.ph)*(PX.yHi-PX.yLo);
  /* NavigationToolbar2Tk 와 같게 : 그린 사각형이 그대로 새 축 범위가 된다.
     한 변이 5픽셀도 안 되면 실수로 본다 (matplotlib 도 그렇게 무시한다). */
  if(x1-x0>=5 && y1-y0>=5){
    S.view=[fx(x0),fx(x1)];
    S.ylim=[fy(y1),fy(y0)];
  }else if(x1-x0>=5){
    S.view=[fx(x0),fx(x1)];
  }else if(y1-y0>=5){
    S.ylim=[fy(y1),fy(y0)];
  }
  draw();});
function applyLang(){const d=T[lang];
  document.documentElement.lang=lang;
  $("t-h1").textContent=d.h1; $("t-h2").textContent=d.h2;
  $("t-params").textContent=d.params; $("calc").textContent=d.calc;
  $("t-lim").textContent=d.lim; $("apply").textContent=d.apply; $("t-note").textContent=d.note;
  $("lang-ko").className=lang==="ko"?"on":""; $("lang-en").className=lang==="en"?"on":"";}
$("lang-ko").onclick=()=>{lang="ko";applyLang();};
$("lang-en").onclick=()=>{lang="en";applyLang();};
addEventListener("resize",draw);
buildTabs(); buildFields(); applyLang(); draw();
</script>
