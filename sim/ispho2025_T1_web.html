<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISPhO 2025 T1 — Ferromagnetic Domain Wall Dynamics · HaslaLab</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --ink:#1b2430; --muted:#5b6b7c;
    --line:#d8e0e8; --accent:#2c6f9b; --accent-soft:#eaf4fb;
    --disp-bg:#101418; --disp-fg:#8fd6ff;
    --mx:#e02424; --my:#b8862b; --mz:#2c6f9b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:16px;display:flex;gap:16px;align-items:flex-start}
  @media(max-width:1080px){.wrap{flex-direction:column}}
  .panel{flex:0 0 300px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:14px;position:sticky;top:16px}
  @media(max-width:1080px){.panel{position:static;width:100%;flex:1 1 auto}}
  .panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .panel h2:first-of-type{margin-top:0}
  label.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    margin:11px 0 3px;color:var(--muted);font-size:12.5px}
  label.row b{font:600 13px ui-monospace,Consolas,monospace;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);
    border-radius:6px;font:13px ui-monospace,monospace}
  button{width:100%;padding:9px 10px;margin:5px 0;cursor:pointer;background:#fff;
    border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;
    color:var(--ink);text-align:left;transition:.12s}
  button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);
    font-weight:600;text-align:center}
  button.primary:hover:not(:disabled){background:#22587c}
  .seg{display:flex;gap:6px;margin:4px 0}
  .seg button{flex:1;text-align:center;margin:0;padding:7px 4px}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .disp{background:var(--disp-bg);border-radius:6px;padding:9px 12px;margin:8px 0;
    text-align:right;color:var(--disp-fg);
    font:700 22px/1.15 ui-monospace,Consolas,monospace}
  .disp small{display:block;font:400 10px/1.4 ui-monospace,monospace;color:#5d7f96;
    letter-spacing:.12em;text-transform:uppercase;text-align:left}
  .bar{height:5px;background:#e6ecf2;border-radius:3px;overflow:hidden;margin:8px 0 2px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
  .readout{font:12px ui-monospace,Consolas,monospace;color:var(--muted);background:#f7f9fb;
    border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-top:8px;line-height:1.7}
  .note{font-size:11.5px;color:#8494a3;line-height:1.65;margin-top:10px}
  .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--muted);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .legend{display:flex;gap:12px;font:11px ui-monospace,monospace}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:14px;height:2.5px;border-radius:2px}

  header{max-width:1400px;margin:0 auto;padding:18px 16px 0;display:flex;

  .lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}

<header>

function derivs(m,n,beta,b,alpha,out){
  const gr = GAMMA/(1+alpha*alpha);
  for(let i=0;i<n;i++){

    if(i===0){        nx=m[3];      ny=m[4];      nz=m[5]; }
    else if(i===n-1){ nx=m[3*n-6];  ny=m[3*n-5];  nz=m[3*n-4]; }
    else {            nx=m[o-3]+m[o+3]; ny=m[o-2]+m[o+4]; nz=m[o-1]+m[o+5]; }

    const sp=mx*hx+my*hy+mz*hz;
    out[o]  =-gr*(my*hz-mz*hy)-alpha*gr*(mx*sp-hx);
    out[o+1]=-gr*(mz*hx-mx*hz)-alpha*gr*(my*sp-hy);
    out[o+2]=-gr*(mx*hy-my*hx)-alpha*gr*(mz*sp-hz);
  }
}

/* the wall the organisers build for task B */
function initB(n,centre){
  const m=new Float64Array(3*n);
  for(let i=0;i<n;i++){ const o=3*i;
    if(i < centre-2)      m[o+2]= 1;
    else if(i < centre+3) m[o]  = 1;
    else                  m[o+2]=-1; }
  return m;
}
function initC(L){
  const n=50+L, m=new Float64Array(3*n);
  for(let i=0;i<3*n;i++) m[i]=INIT_C[i];
  return m;
}

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const S={task:"B", alpha:0.5, beta:100, b:0.04, Tspan:20, L:150,
         frames:null, times:null, n:0, cur:NFRAMES-1, busy:false, par:null, done:null};
const $=id=>document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   SOLVER — classical RK4, stepped so the chain stays on the sphere
   ══════════════════════════════════════════════════════════════ */
function solve(onProgress,done){
  const n = S.task==="B" ? 201 : 50+S.L;
  const N = 3*n;
  let m = S.task==="B" ? initB(n,101) : initC(S.L);
  const k=[new Float64Array(N),new Float64Array(N),new Float64Array(N),new Float64Array(N)];
  const tmp=new Float64Array(N);
  /* the exchange term sets the fastest timescale, so the step follows β */
  const dt = Math.min(1e-3, 0.15/Math.max(S.beta,1));
  const total = Math.max(Math.round(S.Tspan/dt),1);
  const every = Math.max(Math.floor(total/(NFRAMES-1)),1);
  const frames=[], times=[];
  const t0=performance.now();
  let step=0;

  function chunk(){
    const until=Math.min(step+4000,total);
    for(; step<until; step++){
      derivs(m,n,S.beta,S.b,S.alpha,k[0]);
      for(let i=0;i<N;i++) tmp[i]=m[i]+dt/2*k[0][i];
      derivs(tmp,n,S.beta,S.b,S.alpha,k[1]);
      for(let i=0;i<N;i++) tmp[i]=m[i]+dt/2*k[1][i];
      derivs(tmp,n,S.beta,S.b,S.alpha,k[2]);
      for(let i=0;i<N;i++) tmp[i]=m[i]+dt*k[2][i];
      derivs(tmp,n,S.beta,S.b,S.alpha,k[3]);
      for(let i=0;i<N;i++) m[i]+=dt/6*(k[0][i]+2*k[1][i]+2*k[2][i]+k[3][i]);
      if(step%every===0 && frames.length<NFRAMES){
        frames.push(Float64Array.from(m)); times.push(step*dt);
      }
    }
    onProgress(step/total);
    if(step<total) setTimeout(chunk,0);
    else{
      frames.push(Float64Array.from(m)); times.push(total*dt);
      done(frames,times,n,total,Math.round(performance.now()-t0));
    }
  }
  chunk();
}

/* ══════════════════════════════════════════════════════════════
   DRAWING
   ══════════════════════════════════════════════════════════════ */
function fit(cv,ratio){
  const dpr=Math.min(devicePixelRatio||1,2), w=cv.clientWidth||700, h=w*ratio;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  return [c,w,h];
}

function drawProfile(){
  const [c,w,h]=fit($("cvProfile"),0.46);
  c.fillStyle="#fbfcfd"; c.fillRect(0,0,w,h);
  const L=48,R=14,B=32;
  /* 제목이 한 줄이면 22, 두 줄이면 38 을 비워 둔다 */
  let Tp=22;
  if(S.frames){
    const P=S.par;
    const one=`[${P.task}] | Time: ${S.times[S.cur].toFixed(2)} / ${P.T.toFixed(2)} | `+
      `\u03b1: ${P.alpha.toFixed(2)} |  \u03b2: ${P.beta.toFixed(2)} | b: ${P.b.toFixed(2)}`+
      (P.task==="C"?` | L: ${P.L.toFixed(2)}`:"");
    c.font="11.5px 'DejaVu Sans',sans-serif";
    if(c.measureText(one).width >= w-L-R-8) Tp=38;
  }
  const pw=w-L-R, ph=h-Tp-B;
  const n=S.n||201;
  const X=i=>L+pw*i/(n-1), Y=v=>Tp+ph*(1-(v+1)/2);

  c.strokeStyle="#c8c8c8"; c.lineWidth=0.5; c.setLineDash([3,3]); c.beginPath();
  for(let v=-1;v<=1.001;v+=0.125){ c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); }
  c.stroke(); c.setLineDash([]);
  c.strokeStyle="#a8a8a8"; c.lineWidth=1; c.beginPath();
  for(let v=-1;v<=1.001;v+=0.25){ c.moveTo(L,Y(v)); c.lineTo(L+pw,Y(v)); }
  c.stroke();
  c.strokeStyle="#b4cadc"; c.beginPath(); c.moveTo(L,Y(0)); c.lineTo(L+pw,Y(0)); c.stroke();
  c.fillStyle="#8fa2b4"; c.font="10px ui-monospace,monospace"; c.textAlign="right";
  for(let v=-1;v<=1.001;v+=0.5) c.fillText(v.toFixed(1),L-7,Y(v)+3.5);
  c.textAlign="center";
  const stepX = n>150?50:25;
  for(let i=0;i<n;i+=stepX){ c.fillText(i,X(i),h-10);
    c.strokeStyle="#e3eaf1"; c.beginPath(); c.moveTo(X(i),Tp); c.lineTo(X(i),Tp+ph); c.stroke(); }
  c.fillStyle="#5b6b7c"; c.textAlign="left"; c.fillText("x",L+pw-8,h-10);

  if(!S.frames){ c.fillStyle="#98a6b4"; c.textAlign="center";
    c.font="12px sans-serif"; c.fillText(T[lang].idle,w/2,h/2); return; }
  /* 원본 plots.py 의 제목 형식을 그대로. 좁은 화면에서는 두 줄로 접는다 */
  const P=S.par;
  const head=`[${P.task}] | Time: ${S.times[S.cur].toFixed(2)} / ${P.T.toFixed(2)}`;
  const tail=`\u03b1: ${P.alpha.toFixed(2)} |  \u03b2: ${P.beta.toFixed(2)} | `+
             `b: ${P.b.toFixed(2)}`+(P.task==="C"?` | L: ${P.L.toFixed(2)}`:"");
  c.fillStyle="#000"; c.textAlign="center"; c.textBaseline="top";
  c.font="11.5px 'DejaVu Sans',sans-serif";
  const one=head+" | "+tail;
  if(Tp===22){ c.fillText(one, L+pw/2, 5); }
  else { c.fillText(head, L+pw/2, 3); c.fillText(tail, L+pw/2, 19); }
  const f=S.frames[S.cur];
  const cols=["var(--mx)","var(--my)","var(--mz)"];
  const raw=["#e02424","#b8862b","#2c6f9b"];
  for(let comp=0;comp<3;comp++){
    c.strokeStyle=raw[comp]; c.lineWidth=1.5; c.beginPath();
    for(let i=0;i<n;i++){ const v=f[3*i+comp];
      i? c.lineTo(X(i),Y(v)) : c.moveTo(X(i),Y(v)); }
    c.stroke();
  }
  /* 범례 — 원본의 ax.legend() */
  const names=["m_x","m_y","m_z"];
  c.font="11px 'DejaVu Sans',sans-serif"; c.textAlign="left"; c.textBaseline="middle";
  const bx=L+pw-86, by=Tp+8;
  c.fillStyle="rgba(255,255,255,.85)"; c.fillRect(bx-6,by-6,84,50);
  c.strokeStyle="#b0b0b0"; c.lineWidth=0.8; c.strokeRect(bx-6,by-6,84,50);
  for(let i=0;i<3;i++){
    c.strokeStyle=raw[i]; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(bx,by+i*15+4); c.lineTo(bx+22,by+i*15+4); c.stroke();
    c.fillStyle="#000"; c.fillText(names[i],bx+27,by+i*15+4);
  }
}

/* ══════════════════════════════════════════════════════════════
   CONTROLS
   ══════════════════════════════════════════════════════════════ */
function buildTaskSeg(){
  const d=T[lang], box=$("taskSeg"); box.innerHTML="";
  [["B",d.taskB],["C",d.taskC]].forEach(([k,label])=>{
    const b=document.createElement("button");
    b.textContent=label; if(k===S.task) b.className="on";
    b.onclick=()=>{ S.task=k; $("Lwrap").style.display = k==="C"?"block":"none";
                    buildTaskSeg(); applyLang(); };
    box.appendChild(b);
  });
  $("t-taskdesc").textContent = S.task==="B" ? d.descB : d.descC;
}
const bind=(id,key,fmt)=>{ $(id).oninput=e=>{ S[key]=parseFloat(e.target.value); applyLang(); }; };
bind("alpha","alpha"); bind("beta","beta"); bind("bfield","b");
bind("Tspan","Tspan"); bind("Lchain","L");
$("bfield").oninput=e=>{S.b=parseFloat(e.target.value); applyLang();};
$("Lchain").oninput=e=>{S.L=parseInt(e.target.value); applyLang();};

$("run").onclick=()=>{
  if(S.busy) return;
  S.busy=true;
  $("run").disabled=true; $("run").textContent=T[lang].running;
  $("status").textContent=T[lang].running;
  setTimeout(()=>solve(
    p=>{ $("prog").style.width=(p*100).toFixed(1)+"%"; },
    (frames,times,n,steps,ms)=>{
      S.par={task:S.task,alpha:S.alpha,beta:S.beta,b:S.b,T:S.Tspan,L:S.L};
      S.frames=frames; S.times=times; S.n=n; S.cur=frames.length-1; S.busy=false;
      $("run").disabled=false; $("run").textContent=T[lang].run;
      $("prog").style.width="100%";
      S.done={steps,ms};
      $("status").textContent=`${T[lang].doneA}${steps}${T[lang].doneB}${ms}${T[lang].doneC}`;
      $("tval").disabled=false; $("seek").disabled=false; $("csv").disabled=false;
      $("tval").value=S.times[S.cur].toFixed(2);
      applyLang(); drawProfile();
    }),20);
};
$("seek").onclick=()=>{
  if(!S.times) return;
  const want=parseFloat($("tval").value);
  if(isNaN(want)) return;
  let best=0;
  for(let i=1;i<S.times.length;i++)
    if(Math.abs(S.times[i]-want)<Math.abs(S.times[best]-want)) best=i;
  S.cur=best; applyLang(); drawProfile();
};

$("csv").onclick=()=>{
  if(!S.frames) return;
  const f=S.frames[S.cur];
  let csv="x,mx,my,mz\n";
  for(let i=0;i<S.n;i++) csv+=`${i},${f[3*i].toExponential(8)},${f[3*i+1].toExponential(8)},${f[3*i+2].toExponential(8)}\n`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`ISPhO2025_${S.task}_t${S.times[S.cur].toFixed(3)}.csv`; a.click();
};

/* ══════════════════════════════════════════════════════════════
   LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const d=T[lang];
  document.documentElement.lang=lang;
  $("t-title").textContent=d.title; $("t-sub").textContent=d.sub;
  $("t-h-task").textContent=d.hTask; $("t-h-par").textContent=d.hPar;
  $("t-alpha").textContent=d.alpha; $("v-alpha").textContent=S.alpha.toFixed(2);
  $("t-beta").textContent=d.beta;   $("v-beta").textContent=S.beta.toFixed(0);
  $("t-b").textContent=d.b;         $("v-b").textContent=S.b.toFixed(3);
  $("t-T").textContent=d.Tspan;     $("v-T").textContent=S.Tspan.toFixed(0);
  $("t-L").textContent=d.L;         $("v-L").textContent=S.L.toFixed(0);
  $("run").textContent = S.busy ? d.running : d.run;
  $("t-h-view").textContent=d.hView; $("t-t").textContent=d.t;
  $("v-t").textContent = S.times ? S.times[S.cur].toFixed(3) : "—";
  $("seek").textContent=d.seek; $("csv").textContent=d.csv;
  $("t-cap1").textContent=d.cap1;
  $("t-note").textContent=d.note;
  if(!S.frames) $("status").textContent=d.idle;
  else if(S.done) $("status").textContent=`${d.doneA}${S.done.steps}${d.doneB}${S.done.ms}${d.doneC}`;
  $("t-taskdesc").textContent = S.task==="B" ? d.descB : d.descC;
  $("lang-ko").className = lang==="ko"?"on":"";
  $("lang-en").className = lang==="en"?"on":"";
}
$("lang-ko").onclick=()=>{lang="ko";buildTaskSeg();applyLang();};
$("lang-en").onclick=()=>{lang="en";buildTaskSeg();applyLang();};

/* ══════════════════════════════════════════════════════════════
   LOOP
   ══════════════════════════════════════════════════════════════ */
addEventListener("resize",()=>{drawProfile();});
buildTaskSeg(); applyLang(); drawProfile();
</script>
