/* ── seeded random (replaces random.Random) ── */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
class RNG{
  constructor(seed){ this.r=mulberry32(seed>>>0); this._sp=null; }
  uniform(a,b){ return a+this.r()*(b-a); }
  gauss(mu,sd){
    if(this._sp!==null){ const v=this._sp; this._sp=null; return mu+sd*v; }
    let u=0,v=0; while(u===0)u=this.r(); while(v===0)v=this.r();
    const R=Math.sqrt(-2*Math.log(u));
    this._sp=R*Math.sin(2*Math.PI*v);
    return mu+sd*R*Math.cos(2*Math.PI*v);
  }
}

/* ── holes and nodes ── */
function nodeOf(h){ return h[0]==="rail" ? "rail|"+h[1] : h[0]+"|"+h[1]; }
function holePos(h){
  return h[0]==="rail" ? [BX+h[2]*P, BY+ROW_Y[h[1]]*P]
                       : [BX+h[1]*P, BY+ROW_Y[h[2]]*P];
}
function sameHole(a,b){
  if(!a||!b) return false;
  return a[0]===b[0] && a[1]===b[1] && a[2]===b[2];
}
function allHoles(){
  const out=[];
  for(let c=1;c<=NCOL;c++){
    for(const r of ROWS_L) out.push(["L",c,r]);
    for(const r of ROWS_R) out.push(["R",c,r]);
    for(const nm of RAILS) out.push(["rail",nm,c]);
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════
   2.  CIRCUIT  —  nodal analysis (direct transcription)
   ══════════════════════════════════════════════════════════════ */
function gauss(A,b){
  const n=b.length;
  const M=A.map((row,i)=>row.slice().concat([b[i]]));
  for(let c=0;c<n;c++){
    let p=c;
    for(let r=c;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-18) return null;
    const tmp=M[c]; M[c]=M[p]; M[p]=tmp;
    const pv=M[c][c];
    for(let r=0;r<n;r++){
      if(r===c) continue;
      const f=M[r][c]/pv;
      if(f){ for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; }
    }
  }
  const out=[]; for(let i=0;i<n;i++) out.push(M[i][n]/M[i][i]);
  return out;
}

class Circuit{
  constructor(){ this.res={}; this.lead={}; }
  nodes(){
    const s=new Set();
    for(const k in this.res){ const [h1,h2]=this.res[k]; s.add(nodeOf(h1)); s.add(nodeOf(h2)); }
    for(const k in this.lead){ const h=this.lead[k]; if(h) s.add(nodeOf(h)); }
    return Array.from(s).sort();
  }
  solve(probeLoaded=true){
    const hv=this.lead["vc"], hg=this.lead["gnd"];
    if(!hv||!hg) return null;
    const nv=nodeOf(hv), ng=nodeOf(hg);
    if(nv===ng) return "short";
    const nodes=this.nodes();
    const idx={}; nodes.forEach((n,i)=>idx[n]=i);
    const n=nodes.length;
    const G=[], I=[];
    for(let i=0;i<n;i++){ G.push(new Array(n).fill(0)); I.push(0); }
    const stamp=(a,b,g)=>{
      const ia=idx[a], ib=idx[b];
      G[ia][ia]+=g; G[ib][ib]+=g; G[ia][ib]-=g; G[ib][ia]-=g;
    };
    for(const cid in this.res){
      const [h1,h2,R]=this.res[cid];
      const a=nodeOf(h1), b=nodeOf(h2);
      if(a===b) continue;
      stamp(a,b,1.0/Math.max(R,1e-9));
    }
    const hp=this.lead["probe"];
    if(hp&&probeLoaded){
      const a=nodeOf(hp);
      if(a!==ng) stamp(a,ng,1.0/ADC_RIN);
    }
    for(const a of nodes) if(a!==ng) G[idx[a]][idx[a]]+=1.0/R_LEAK;
    for(const [fixed,val] of [[nv,VCC],[ng,0.0]]){
      const i=idx[fixed];
      for(let j=0;j<n;j++) G[i][j]=0.0;
      G[i][i]=1.0; I[i]=val;
    }
    const V=gauss(G,I);
    if(V===null) return null;
    const volt={}; nodes.forEach(nd=>volt[nd]=V[idx[nd]]);
    let isup=0.0;
    for(const cid in this.res){
      const [h1,h2,R]=this.res[cid];
      const a=nodeOf(h1), b=nodeOf(h2);
      if(a===nv&&b!==nv) isup+=(volt[a]-volt[b])/R;
      else if(b===nv&&a!==nv) isup+=(volt[b]-volt[a])/R;
    }
    if(hp&&probeLoaded&&nodeOf(hp)===nv) isup+=volt[nv]/ADC_RIN;
    if(isup>VCC/R_SHORT) return "short";
    const vp = hp ? volt[nodeOf(hp)] : null;
    return {vp:vp, volt:volt, isup:isup};
  }
}

/* ══════════════════════════════════════════════════════════════
   3.  DEVICE  —  ADC with integral non-linearity and read noise
   ══════════════════════════════════════════════════════════════ */
class Device{
  constructor(k,seed){
    const rng=new RNG(1000*seed+k);
    this.k=k;
    this.gain=1.0+rng.uniform(-0.0012,0.0012);
    this.off=rng.uniform(-0.45,0.45);
    this.a=[rng.uniform(-1.6,1.6),rng.uniform(-1.2,1.2),rng.uniform(-0.9,0.9)];
    this.noise=0.3; this.rng=rng; this.dead=false;
  }
  inl(u){
    return this.a[0]*Math.sin(Math.PI*u)+this.a[1]*Math.sin(2*Math.PI*u)+this.a[2]*Math.sin(3*Math.PI*u);
  }
  read(v){
    const u=Math.max(0,Math.min(1,v/VCC));
    const x=ADC_MAX*u*this.gain+this.off+this.inl(u)+this.rng.gauss(0,this.noise);
    return Math.floor(Math.max(0,Math.min(ADC_MAX,Math.floor(x+0.5))));
  }
}

/* ══════════════════════════════════════════════════════════════
   4.  WORLD
   ══════════════════════════════════════════════════════════════ */
class World{
  constructor(seed){
    seed = (seed===undefined) ? Math.floor(Math.random()*(1<<30)) : seed;
    this.seed=seed; this.rng=new RNG(seed);
    this.cir=new Circuit();
    this.devices=[0,1,2].map(k=>new Device(k,seed));
    this.active=0;
    this.cells_free=6; this.cell_hand=0; this.cells=[0,0,0];
    this.batt_in=[false,false,false]; this.switch=[false,false,false];
    this.spare_used=false;
    this.msg=null;
    this.value={};
    for(const pk in PACKS) for(const [cid,nom] of PACKS[pk])
      this.value[cid]=nom*(1.0+this.rng.uniform(-TOL,TOL));
    this.placed={};
  }
  get power(){
    const k=this.active;
    return this.cells[k]===2 && this.batt_in[k] && this.switch[k];
  }
  get dev(){ return this.devices[this.active]; }
  unload_cell(k){
    if(this.cells[k]<=0) return false;
    this.cells[k]-=1; this.cells_free+=1; return true;
  }
  place(cid,h1,h2){ this.placed[cid]=[h1,h2]; this.cir.res[cid]=[h1,h2,this.value[cid]]; }
  remove(cid){ delete this.placed[cid]; delete this.cir.res[cid]; }
  set_lead(which,hole){ this.cir.lead[which]=hole; }
  measure(){
    if(this.dev.dead) return "dead";
    if(!this.power) return "off";
    const r=this.cir.solve();
    if(r===null) return "nowire";
    if(r==="short"){ this.dev.dead=true; return "short"; }
    if(r.vp===null||r.vp===undefined) return "nowire";
    return this.dev.read(r.vp);
  }
}

function layout(){
  const rect = cv.parentElement.getBoundingClientRect();
  const cssW = Math.max(320, Math.floor(rect.width-20));
  const cssH = Math.max(420, Math.min(Math.round(cssW*0.94), Math.round(window.innerHeight*0.86)));
  DPR = window.devicePixelRatio||1;
  cv.style.height = cssH+"px";
  cv.width = Math.round(cssW*DPR);
  cv.height = Math.round(cssH*DPR);
  CW=cssW; CH=cssH;
  fit();
}
function fit(force){
  if(S.viewTouched && !force) return;
  const x0=24.0, y0=24.0, x1=BX+(NCOL+2.6)*P, y1=BY+18.4*P;
  S.zoom = Math.min(CW/(x1-x0), CH/(y1-y0))*0.98;
  S.pan = [(CW-(x1-x0)*S.zoom)/2.0 - x0*S.zoom,
           (CH-(y1-y0)*S.zoom)/2.0 - y0*S.zoom];
}
const SC = (x,y)=>[x*S.zoom+S.pan[0], y*S.zoom+S.pan[1]];
const INV = (px,py)=>[(px-S.pan[0])/S.zoom, (py-S.pan[1])/S.zoom];

function nearestHole(px,py,rmax){
  rmax = rmax===undefined ? P*0.62 : rmax;
  const [x,y]=INV(px,py);
  let best=null, bd=1e9;
  for(const h of S.holes){
    const [hx,hy]=holePos(h);
    const d=(hx-x)*(hx-x)+(hy-y)*(hy-y);
    if(d<bd){ best=h; bd=d; }
  }
  return bd<=rmax*rmax ? best : null;
}

function fs(pt){ return Math.max(6, Math.round(pt*S.zoom))*1.33; }
function setFont(pt,bold,mono){
  ctx.font = (bold?"bold ":"")+fs(pt).toFixed(1)+"px "+
             (mono?'ui-monospace,Consolas,monospace':'"Malgun Gothic","Apple SD Gothic Neo",sans-serif');
}
function anchorSet(anchor){
  if(anchor==="center"){ ctx.textAlign="center"; ctx.textBaseline="middle"; }
  else if(anchor==="e"){ ctx.textAlign="right";  ctx.textBaseline="middle"; }
  else if(anchor==="w"){ ctx.textAlign="left";   ctx.textBaseline="middle"; }
  else { ctx.textAlign="left"; ctx.textBaseline="top"; }        /* nw */
}
function R(x0,y0,x1,y1,fill,outline,width){
  const a=SC(x0,y0), b=SC(x1,y1);
  if(fill){ ctx.fillStyle=fill; ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]); }
}
function RPX(x0,y0,x1,y1,fill,outline,width){
  if(fill){ ctx.fillStyle=fill; ctx.fillRect(x0,y0,x1-x0,y1-y0); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.strokeRect(x0,y0,x1-x0,y1-y0); }
}
function TX(x,y,txt,pt,fill,anchor,bold,mono){
  const a=SC(x,y);
  setFont(pt||9,bold,mono); anchorSet(anchor);
  ctx.fillStyle=fill||C_TXT;
  ctx.fillText(txt,a[0],a[1]);
}
function TXPX(px,py,txt,pxsize,fill,anchor,bold){
  ctx.font=(bold?"bold ":"")+pxsize+'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  anchorSet(anchor); ctx.fillStyle=fill; ctx.fillText(txt,px,py);
}
function LN(pts,stroke,width,round){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=stroke; ctx.lineWidth=width||1;
  ctx.lineCap=round?"round":"butt"; ctx.lineJoin="round"; ctx.stroke();
  ctx.lineCap="butt";
}
function POLY(pts,fill,outline,width){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.stroke(); }
}
function OVAL(x0,y0,x1,y1,fill,outline,width){
  ctx.beginPath();
  ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,2*Math.PI);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(outline){ ctx.strokeStyle=outline; ctx.lineWidth=width||1; ctx.stroke(); }
}

function matrixCells(){
  const cells=[];
  for(let i=0;i<5;i++) cells.push([0,0,0,0,0]);
  if(!S.scroll) return cells;
  const [txt,t0]=S.scroll;
  let cols=[];
  for(const ch of txt){
    const pat=FONT5[ch]||FONT5["?"];
    for(let c=0;c<5;c++){
      const col=[]; for(let r=0;r<5;r++) col.push(pat[r][c]==="1"?1:0);
      cols.push(col);
    }
    cols.push([0,0,0,0,0]);
  }
  const blank=()=>[0,0,0,0,0];
  cols=[blank(),blank(),blank(),blank(),blank()].concat(cols,[blank(),blank(),blank(),blank(),blank()]);
  const step=0.13;
  const k=Math.floor((performance.now()/1000-t0)/step);
  if(k>cols.length-5){ S.scroll=null; return cells; }
  for(let c=0;c<5;c++){
    const col=(k+c<cols.length)?cols[k+c]:blank();
    for(let r=0;r<5;r++) cells[r][c]=col[r];
  }
  return cells;
}

  const org=S.matrixOrg; if(!org) return;

}

function kindOf(cid){
  for(const pk in PACKS) for(const [c2,nom,kd,cl] of PACKS[pk]) if(c2===cid) return [kd,cl];
  return [null,null];
}
function drawResistors(){
  for(const cid in w.placed){
    const [h1,h2]=w.placed[cid];
    const p1=holePos(h1), p2=holePos(h2);
    const a=SC(p1[0],p1[1]), b=SC(p2[0],p2[1]);
    LN([a,b],"#b9bfc6",Math.max(1,Math.round(0.16*P*S.zoom)));
    const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
    const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    const ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);
    const bl=Math.min(0.62*L,1.5*P), bw=0.34*P;
    const [kind,col]=kindOf(cid);
    const pts=[];
    for(const [dx,dy] of [[-bl/2,-bw/2],[bl/2,-bw/2],[bl/2,bw/2],[-bl/2,bw/2]]){
      const rx=mx+dx*Math.cos(ang)-dy*Math.sin(ang);
      const ry=my+dx*Math.sin(ang)+dy*Math.cos(ang);
      pts.push(SC(rx,ry));
    }
    POLY(pts, kind==="tube"?col:"#d9c39a","#5c5347",1);
    if(kind!=="tube"){
      for(const f of [-0.28,-0.12,0.06,0.26]){
        const bx0=mx+f*bl*Math.cos(ang), by0=my+f*bl*Math.sin(ang);
        const q1=SC(bx0+bw/2*Math.sin(ang), by0-bw/2*Math.cos(ang));
        const q2=SC(bx0-bw/2*Math.sin(ang), by0+bw/2*Math.cos(ang));
        LN([q1,q2],"#3a3f46",Math.max(1,Math.round(0.09*P*S.zoom)));
      }
    }
    const t=SC(mx,my-0.62*P);
    ctx.font=Math.max(6,Math.round(7*S.zoom))*1.33+"px ui-monospace,Consolas,monospace";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#6b7278"; ctx.fillText(cid,t[0],t[1]);
  }
}

function drawWires(){
  for(const key of ["vc","gnd","probe"]){
    const h=w.cir.lead[key];
    if(!h||!S.pinXY[key]) continue;
    const p0=S.pinXY[key], p1=holePos(h);
    const a=SC(p0[0],p0[1]), b=SC(p1[0],p1[1]);
    const mid=SC((p0[0]+p1[0])/2+40,(p0[1]+p1[1])/2+60);
    const wdt=Math.max(2,Math.round(0.16*P*S.zoom));
    for(const [col,ww] of [[caseCol(key),wdt+3],[wireCol(key),wdt]]){
      ctx.beginPath(); ctx.moveTo(a[0],a[1]);
      ctx.quadraticCurveTo(mid[0],mid[1],b[0],b[1]);
      ctx.strokeStyle=col; ctx.lineWidth=ww; ctx.lineCap="round"; ctx.stroke();
      ctx.lineCap="butt";
    }
    const r=0.24*P*S.zoom;
    OVAL(b[0]-r,b[1]-r,b[0]+r,b[1]+r,wireCol(key),"#0c1218",1);
    ctx.font=Math.max(6,Math.round(7*S.zoom))*1.33+'px "Malgun Gothic",sans-serif';
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle = key==="gnd"?caseCol(key):wireCol(key);
    ctx.fillText(d().lead[key], b[0]+14, b[1]-12);
  }
}

function drawCarry(){
  const [px,py]=S.mouse;
  if(w.cell_hand){
    RPX(px+8,py-7,px+42,py+7,"#c9c2ad","#8d8674",1);
    RPX(px+42,py-3,px+47,py+3,"#b9b2a0","#8d8674",1);
    TXPX(px+8,py-14,d().carryCell,12,C_ACC,"w",true);
  }
  if(S.carry&&S.carry[0]==="res")
    TXPX(px+16,py-14,d().carryRes(S.carry[1]),13,C_ACC,"w",true);
  else if(S.carry&&S.carry[0]==="lead")
    TXPX(px+16,py-14,d().carryLead(d().lead[S.carry[1]]),13,C_ACC,"w",true);
  if(S.pending){
    const hp=holePos(S.pending), p=SC(hp[0],hp[1]);
    ctx.setLineDash([4,3]);
    LN([p,[px,py]],C_ACC,2);
    ctx.setLineDash([]);
  }
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=C_BG; ctx.fillRect(0,0,CW,CH);
  drawBench();
  drawBreadboard();
  drawMicrobit();
  drawResistors();
  drawWires();
  drawMatrix();
  drawCarry();
}

/* ══════════════════════════════════════════════════════════════
   7.  INTERACTION
   ══════════════════════════════════════════════════════════════ */
function say(k){ w.msg = k===null ? null : {k:k, a:Array.prototype.slice.call(arguments,1)}; }
function inside(z,x,y){ return !!z && z[0]<=x && x<=z[2] && z[1]<=y && y<=z[3]; }
function sz(z){ const a=SC(z[0],z[1]), b=SC(z[2],z[3]); return [a[0],a[1],b[0],b[1]]; }

function mousePos(e){
  const r=cv.getBoundingClientRect();
  return [e.clientX-r.left, e.clientY-r.top];
}

cv.addEventListener("mousemove",e=>{
  S.mouse=mousePos(e);
  if(S.draggingPlug){
    if(inside(sz(S.zoneSocket),S.mouse[0],S.mouse[1])){
      w.batt_in[w.active]=true; S.draggingPlug=false; say("plugged");
    }
  }
  if(S.lp0){
    const dx=S.mouse[0]-S.lp0[0], dy=S.mouse[1]-S.lp0[1];
    if(dx||dy){ S.lp0=S.mouse.slice(); S.viewTouched=true;
      S.pan=[S.pan[0]+dx,S.pan[1]+dy]; }
  }
});
cv.addEventListener("mouseleave",()=>{ S.lp0=null; S.draggingPlug=false; });
window.addEventListener("mouseup",()=>{ S.lp0=null; cv.classList.remove("dragging"); });

cv.addEventListener("mousedown",e=>{
  if(e.button===1){ e.preventDefault(); S.lp0=mousePos(e); cv.classList.add("dragging"); return; }
  if(e.button!==0) return;
  const [x,y]=mousePos(e); S.mouse=[x,y];
  const k=w.active;

  if(inside(sz(S.zoneSwitch),x,y)){
    w.switch[k]=!w.switch[k];
    say(w.switch[k]?"swOn":"swOff");
    return;
  }
  for(let c=0;c<S.zoneSlot.length;c++){
    if(inside(sz(S.zoneSlot[c]),x,y)){
      if(w.cells[k]>c){ w.unload_cell(k); w.cell_hand=0; say("cellOut"); }
      else if(!w.cell_hand){ say("pickFirst"); }
      else { w.cells[k]+=1; w.cell_hand=0; say("cellIn",w.cells[k]); }
      return;
    }
  }
  for(let c=0;c<S.zoneCell.length;c++){
    if(!inside(sz(S.zoneCell[c]),x,y)) continue;
    if(w.cell_hand){ w.cells_free+=1; w.cell_hand=0; say("cellDown"); }
    else if(w.cells_free>0){ w.cells_free-=1; w.cell_hand=1; say("cellHand"); }
    return;
  }
  if(inside(S.plugPx,x,y)){ S.draggingPlug=true; return; }
  if(inside(sz(S.zoneBtnA),x,y)||inside(sz(S.zoneBtnB),x,y)){ pressButton(); return; }
  for(const key in S.zonePin){
    if(inside(sz(S.zonePin[key]),x,y)){
      S.carry=["lead",key]; S.pending=null;
      say("leadHole",key); return;
    }
  }
  const h=nearestHole(x,y);
  if(S.carry&&S.carry[0]==="lead"){
    if(h){ w.set_lead(S.carry[1],h); say("leadTo",S.carry[1],h); S.carry=null; }
    return;
  }
  if(S.carry&&S.carry[0]==="res"){
    if(!h) return;
    if(S.pending===null){ S.pending=h; say("secondLead"); }
    else{
      if(nodeOf(h)===nodeOf(S.pending)){ say("sameNode"); return; }
      w.place(S.carry[1],S.pending,h);
      refreshChips();
      S.carry=null; S.pending=null; say(null);
    }
    return;
  }
  const cid=resistorAt(x,y);
  if(cid){ w.remove(cid); refreshChips(); say("resOut",cid); return; }
  S.lp0=[x,y]; cv.classList.add("dragging");
});

function resistorAt(px,py){
  for(const cid in w.placed){
    const [h1,h2]=w.placed[cid];
    const p1=holePos(h1), p2=holePos(h2);
    const m=SC((p1[0]+p2[0])/2,(p1[1]+p2[1])/2);
    if(Math.abs(m[0]-px)<0.8*P*S.zoom && Math.abs(m[1]-py)<0.5*P*S.zoom) return cid;
  }
  return null;
}

cv.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const [x,y]=mousePos(e);
  if(S.carry||S.pending){ S.carry=null; S.pending=null; return; }
  const cid=resistorAt(x,y);
  if(cid){ w.remove(cid); refreshChips(); return; }
  const h=nearestHole(x,y);
  if(h){
    for(const key in w.cir.lead){
      if(sameHole(w.cir.lead[key],h)){
        w.cir.lead[key]=null; say("leadOut",key); return;
      }
    }
  }
});

cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const dir = e.deltaY<0 ? 1 : -1;
  const [x,y]=mousePos(e);
  S.viewTouched=true;
  const [x0,y0]=INV(x,y);
  S.zoom=Math.max(0.5,Math.min(3.0,S.zoom*(dir>0?1.12:1/1.12)));
  const [x1,y1]=INV(x,y);
  S.pan[0]+=(x1-x0)*S.zoom;
  S.pan[1]+=(y1-y0)*S.zoom;
},{passive:false});

/* touch: one finger pans, tap acts */
let touchStart=null;
cv.addEventListener("touchstart",e=>{
  if(e.touches.length!==1) return;
  const r=cv.getBoundingClientRect();
  touchStart=[e.touches[0].clientX-r.left, e.touches[0].clientY-r.top, Date.now()];
  S.mouse=[touchStart[0],touchStart[1]];
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(e.touches.length!==1||!touchStart) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const x=e.touches[0].clientX-r.left, y=e.touches[0].clientY-r.top;
  S.viewTouched=true;
  S.pan=[S.pan[0]+(x-S.mouse[0]), S.pan[1]+(y-S.mouse[1])];
  S.mouse=[x,y];
  touchStart[3]=true;
},{passive:false});
cv.addEventListener("touchend",e=>{
  if(touchStart && !touchStart[3] && Date.now()-touchStart[2]<400){
    cv.dispatchEvent(new MouseEvent("mousedown",{
      button:0, clientX:touchStart[0]+cv.getBoundingClientRect().left,
      clientY:touchStart[1]+cv.getBoundingClientRect().top}));
  }
  touchStart=null;
},{passive:true});

function pressButton(){
  const k=w.active;
  if(w.cells[k]<2){ say("needCells",w.cells[k]); return; }
  if(!w.batt_in[k]){ say("notPlugged"); return; }
  const r=w.measure();
  if(r==="off"){ say("off"); return; }
  if(r==="nowire"){ say("nowire"); return; }
  if(r==="dead"){ say("dead"); S.scroll=["Err",performance.now()/1000]; return; }
  if(r==="short"){
    S.scroll=["Err",performance.now()/1000];
    say("short"); askSpare(); return;
  }
  S.lastReading=r;
  S.scroll=[String(r),performance.now()/1000];
}
function askSpare(){
  if(w.spare_used){ alert(d().m.spareOnce); return; }
  if(confirm(d().m.askSpare)){
    w.spare_used=true; w.dev.dead=false; say("gotSpare");
  }
}

/* ══════════════════════════════════════════════════════════════
   8.  SIDE PANEL
   ══════════════════════════════════════════════════════════════ */
function chipLabel(cid,nom,kind){
  if(kind==="tube") return d().unknown;
  if(nom>=1000) return (nom/1000)+" k";
  return ""+nom;
}
function buildPacks(){
  const box=$("packBox"); box.innerHTML="";
  for(const key of ["A","B","C","D"]){
    const lab=document.createElement("div");
    lab.className="packlab"; lab.textContent=d().packs[key];
    box.appendChild(lab);
    const grid=document.createElement("div"); grid.className="chips";
    for(const [cid,nom,kind,col] of PACKS[key]){
      const b=document.createElement("button");
      b.textContent=chipLabel(cid,nom,kind);
      b.title=cid;
      b.dataset.cid=cid;
      if(kind==="tube"&&col) b.style.background=col;
      b.onclick=()=>takeResistor(cid);
      grid.appendChild(b);
    }
    box.appendChild(grid);
  }
  refreshChips();
}
function refreshChips(){
  document.querySelectorAll("#packBox button").forEach(b=>{
    b.classList.toggle("placed", !!w.placed[b.dataset.cid]);
  });
}
function takeResistor(cid){
  if(w.placed[cid]){ say("already"); return; }
  S.carry=["res",cid]; S.pending=null; say("firstLead");
}

function statusText(){
  const L=[];
  const miss=["vc","gnd","probe"].filter(k=>!w.cir.lead[k]).map(k=>d().lead[k]);
  if(miss.length) L.push(d().stMiss(miss.join(", ")));
  if(w.cells[w.active]<2) L.push(d().stCells(w.cells[w.active],w.cells_free));
  else if(!w.batt_in[w.active]) L.push(d().stPlug);
  else if(!w.switch[w.active]) L.push(d().stSwitch);
  if(w.dev.dead) L.push(d().stDead);
  L.push(d().stCheck);
  if(w.msg){
    const f=d().m[w.msg.k];
    L.push("• "+(typeof f==="function" ? f.apply(null,w.msg.a) : f));
  }
  return L;
}
function renderStatus(){
  const box=$("status");
  const L=statusText();
  box.innerHTML="";
  for(const line of L){
    const el=document.createElement("div"); el.textContent=line; box.appendChild(el);
  }
}

document.querySelectorAll('input[name="dev"]').forEach(r=>{
  r.onchange=()=>{
    w.active=parseInt(r.value,10);
    say("swapped",w.active+1);
  };
});
$("btnFit").onclick=()=>{ S.viewTouched=false; fit(true); };

/* ══════════════════════════════════════════════════════════════
   9.  LANGUAGE
   ══════════════════════════════════════════════════════════════ */
function applyLang(){
  const t=d();
  document.documentElement.lang=lang;
  $("t-title").textContent=t.title;
  $("t-sub").textContent=t.sub;
  $("t-benchcap").textContent=t.benchcap;
  $("t-h-kit").textContent=t.hKit;
  $("t-h-packs").textContent=t.hPacks;
  $("t-h-view").textContent=t.hView;
  for(let i=0;i<3;i++) $("t-dev"+i).textContent=t.dev(i);
  $("t-kithint").textContent=t.kithint;
  $("t-viewhint").textContent=t.viewhint;
  $("btnFit").textContent=t.fit;
  $("btn-ko").className = lang==="ko"?"on":"";
  $("btn-en").className = lang==="en"?"on":"";
  document.title = lang==="ko"
    ? "APhO 2026 E2 — Micro:bit ADC로 미지 저항 추정 · HaslaLab"
    : "APhO 2026 E2 — Unknown Resistance with the Micro:bit ADC · HaslaLab";
  buildPacks();
  renderStatus();
}
$("btn-ko").onclick=()=>{ lang="ko"; applyLang(); };
$("btn-en").onclick=()=>{ lang="en"; applyLang(); };

/* ══════════════════════════════════════════════════════════════
   10.  MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let statusTick=0;
function tick(){
  draw();
  if(++statusTick%6===0) renderStatus();
  requestAnimationFrame(tick);
}

window.addEventListener("resize",layout);
layout(); applyLang(); requestAnimationFrame(tick);
</script>
